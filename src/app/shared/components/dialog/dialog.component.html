<div class="backdrop" (click)="closed.emit()">
  <div class="panel" role="dialog" aria-modal="true" [attr.aria-label]="heading()" (click)="$event.stopPropagation()">
    <header class="head">
      <h2 class="title">{{ heading() }}</h2>
      <button type="button" class="close-btn" (click)="closed.emit()" aria-label="Close">×</button>
    </header>
    <div class="body">
      <ng-content></ng-content>
    </div>
    <footer class="foot">
      <ng-content select="[dialog-footer]"></ng-content>
    </footer>
  </div>
</div>
